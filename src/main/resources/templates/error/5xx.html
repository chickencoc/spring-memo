<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:replace="~{fragment/head.html :: frag-head}" ></title>
</head>
<body>
    <div id="wrap" class="error-page">
        <div class="error-panel">
            <h1 class="error-code" th:text="${status}">status</h1>
            <h1 class="error-title" th:text="${error}">error</h1>
            <button class="btn btn-outline error-action" onclick="javascript:history.back()">이전 페이지</button>
        </div>
    </div>
</body>
</html>
