<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <div th:fragment="frag-user-status" class="memo-user-status">
        <div class="memo-user-status-row" th:if="${session.SES_USER.status} == 'GUEST'">
            <span class="memo-badge" th:text="${session.SES_USER.displayName}">user</span>
            <a class="btn" href="/memo/login"><span class="btn-text">로그인</span></a>
        </div>
        <div class="memo-user-status-row" th:if="${session.SES_USER.status} != 'GUEST'">
            <span class="memo-badge" th:text="${session.SES_USER.displayName}">user</span>
            <a class="btn" href="javascript:logout()"><span class="btn-text">로그아웃</span></a>
        </div>
        <hr />
        <script>
            function logout() {
                fetch("/api/login/expire", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: memoCsrfHeaders()
                }).then(res => res.text()).then(txt => txt == 'true' && (location.href="/memo/list") )
            }
        </script>
    </div>
</html>
